[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-data-scraper"
version = "0.1.0"
description = "Collection, normalisation and historisation of drug prices from national public sources"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pdfplumber>=0.11",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.12",
    "libarchive-c>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["registry/*.yaml", "dashboard/templates/*.html", "dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore:Dialect sqlite\\+pysqlite does \\*not\\* support Decimal objects natively"]
